<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root{--ground:#EDEFF2;--surface:#FFF;--raise:#F6F7F9;--line:#D3D8E0;--ink:#14161A;--muted:#5C6472;
--accent:#1F6FEB;--soft:#E4EDFD;--good:#17855A;--goodsoft:#E1F2EA;--bad:#B3261E;--warn:#8A6100}
@media (prefers-color-scheme:dark){:root{--ground:#14161A;--surface:#1C1F25;--raise:#232830;--line:#2C313A;
--ink:#E8EAED;--muted:#939AA6;--accent:#4C9AFF;--soft:#1B2A44;--good:#3FBF7F;--goodsoft:#16311F;
--bad:#FF6B6B;--warn:#E0B341}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-size:17px;line-height:1.45;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-bottom:120px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
padding:8px 0;padding-top:calc(8px + env(safe-area-inset-top))}
.nav{display:flex;align-items:center;gap:8px}
.nav button{flex:0 0 auto;min-width:58px;height:50px;border-radius:12px;border:1px solid var(--line);
background:var(--surface);color:var(--ink);font-size:19px;font-weight:600;cursor:pointer}
.nav .today{flex:1 1 auto;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
display:flex;flex-direction:column;gap:1px;line-height:1.15}
.nav .today b{font-size:15px;letter-spacing:0;text-transform:none}
#status{text-align:center;font-size:12px;padding:5px 0 0;color:var(--muted);min-height:20px}
#status.ok{color:var(--good)} #status.err{color:var(--bad);font-weight:650} #status.warn{color:var(--warn)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.s-head{margin:16px 0 14px}
.s-eyebrow{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.s-head h2{margin:2px 0 0;font-size:38px;line-height:1.02;letter-spacing:-.025em}
.s-date{margin:3px 0 0;color:var(--muted);font-size:15px}
.deload{margin:11px 0 0;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--soft);
border:1px solid var(--line)}
.notice{margin:0 0 12px;padding:11px 13px;border-radius:11px;font-size:15px;font-weight:600;
background:var(--goodsoft);color:var(--good);border:1px solid var(--good)}
.notice.soft{background:var(--soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.ex{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}
.ex.done{border-color:var(--good);background:var(--goodsoft)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex h3{margin:0;font-size:19px;letter-spacing:-.01em}
.chip{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--accent);background:var(--soft);
border-radius:999px;padding:4px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex.done .chip{color:var(--good);background:transparent}
.cue{margin:5px 0 12px;font-size:14px;color:var(--muted)}
.entry{display:flex;align-items:center;gap:9px}
.wt-wrap{position:relative;flex:1 1 auto;display:block}
.wt-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;
color:var(--muted);pointer-events:none;letter-spacing:.04em}
input.wt{width:100%;height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--raise);
color:var(--ink);text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input.wt.set{border-color:var(--good)}
input.wt::placeholder{font-size:15px;font-weight:600;color:var(--muted);opacity:1}
.enter{flex:0 0 auto;height:58px;padding:0 20px;border-radius:12px;cursor:pointer;
border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-size:17px;font-weight:700}
.enter.set{background:var(--good);border-color:var(--good)}
.warm{margin:12px 0 0;padding:11px 12px;border-radius:11px;background:var(--raise);border:1px solid var(--line)}
.warm .warmlab{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.05em;
text-transform:uppercase;line-height:1.3}
.warmb{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;height:46px;
margin-bottom:7px;padding:0 13px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);
background:var(--surface);color:var(--ink);font-size:16px;font-weight:650;
font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.warmb.on{border-color:var(--good);background:var(--goodsoft);color:var(--good)}
.warmb em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;
text-transform:uppercase;font-family:ui-sans-serif,system-ui,sans-serif}
.warmb.on em{color:var(--good)}
.warmnote{display:block;font-size:12px;color:var(--muted)}
.setlab{display:block;font-size:12px;color:var(--muted);margin:13px 0 7px}
.setbtns{display:flex;gap:9px}
.setb{flex:1 1 0;height:60px;border-radius:12px;cursor:pointer;border:2px solid var(--accent);
background:transparent;color:var(--accent);font-size:22px;font-weight:750;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.setb.on{background:var(--good);border-color:var(--good);color:#fff}
.video{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;margin-top:11px;
border-radius:12px;font-size:15px;font-weight:650;text-decoration:none;background:var(--soft);color:var(--accent)}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.ti{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tc{display:flex;flex-direction:column;min-width:104px}
#clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;
font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
#who{font-size:11.5px;color:var(--muted);height:15px;overflow:hidden}
#clock.run{color:var(--accent)} #clock.fin{color:var(--good)}
.tb{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tb button{height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--raise);
color:var(--ink);font-size:15px;font-weight:650;cursor:pointer;font-variant-numeric:tabular-nums}
.tb button.stop{border-color:var(--accent);color:var(--accent)}
.setup{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:16px;margin:18px 0}
.setup h3{margin:0 0 8px;font-size:19px}
.setup p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.setup input{width:100%;height:50px;border-radius:11px;border:1.5px solid var(--line);background:var(--raise);
color:var(--ink);padding:0 12px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.setup button{margin-top:10px;height:50px;width:100%;border-radius:11px;border:none;background:var(--accent);
color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;
text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){#clock.run{animation:p 1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.72}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="nav">
      <button type="button" id="prev" aria-label="Previous session">&#9664;</button>
      <button type="button" class="today" id="jump"><span>Jump to</span><b id="navlab">Today</b></button>
      <button type="button" id="next" aria-label="Next session">&#9654;</button>
    </div>
    <div id="status">&nbsp;</div>
  </div>
  <main id="root"></main>
</div>

<div class="timerbar"><div class="ti">
  <div class="tc"><div id="clock" aria-live="polite">0:00</div><div id="who"></div></div>
  <div class="tb">
    <button type="button" class="stop" id="stopb">Stop</button>
  </div>
</div></div>

<script>
(function () {
  var LOG_KEY = 'ledger_log', PEND_KEY = 'ledger_pending';
  // Supabase Postgres. The publishable key is meant to ship in a client. The table
  // allows select/insert/update to anon and deliberately withholds delete, and it
  // lives in its own project so this key reaches nothing else.
  var API = 'https://wikeqozoeravyduqjvhm.supabase.co/rest/v1/entries';
  var KEY = 'sb_publishable_V3tX3AaJ2qM_o3hD7uvIdw_H9B7MyEt';
  function hdrs(extra){
    var h = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  var P = null, LOG = {}, view = null, saveTimer = null, dirty = {};
  var shownDay = null, shownType = null, sent = {}, warmDone = {}, lastDay = null;
  // Warm-up ramp, before the FIRST exercise of a session only. Source: 08-Johns-Routine.md,
  // which follows the full-body-page version of Matthews' protocol. [reps, fraction, note]
  var WARM = [[10, 0.5, 'easy'], [10, 0.5, 'faster'], [4, 0.7, '']], WARM_REST = 60;
  function round5(x){ return Math.round(x/5)*5; }
  var root = document.getElementById('root'),
      navlab = document.getElementById('navlab'),
      statusEl = document.getElementById('status');

  function cacheLog(){ try { localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); } catch(e){} }
  function readCache(){ try { return JSON.parse(localStorage.getItem(LOG_KEY) || '{}'); } catch(e){ return {}; } }
  function readPending(){
    try {
      return JSON.parse(localStorage.getItem(PEND_KEY) || '[]').map(function(x){
        if (x.date && !x.session_date){ x.session_date = x.date; delete x.date; }  // legacy queue
        return x;
      });
    } catch(e){ return []; }
  }
  function writePending(q){ try { localStorage.setItem(PEND_KEY, JSON.stringify(q)); } catch(e){} }

  function setStatus(msg, cls){ statusEl.textContent = msg || ' '; statusEl.className = cls || ''; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function todayISO(){ var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function idx(iso){ for (var i=0;i<P.sessions.length;i++) if (P.sessions[i].d===iso) return i; return -1; }
  function nearest(iso){ for (var i=0;i<P.sessions.length;i++) if (P.sessions[i].d>=iso) return P.sessions[i].d;
    return P.sessions[P.sessions.length-1].d; }
  function prevWeight(day, name){
    var best = null;
    for (var d in LOG){
      if (d >= day) continue;
      var e = LOG[d][name];
      if (e && e.w !== '' && e.w != null && (best === null || d > best.d)) best = { d: d, w: e.w };
    }
    return best;
  }
  function setCount(S, e){ return S.dl ? Math.max(1, Math.round(e[1]/2)) : e[1]; }
  function rec(d,n){ if(!LOG[d]) LOG[d]={}; if(!LOG[d][n]) LOG[d][n]={w:'',s:[]}; return LOG[d][n]; }

  // The DOM is rebuilt wholesale on every render, so anything typed into a weight
  // box but not yet committed dies with it. Sweep those values into LOG first.
  function harvest(){
    var out = { day: shownDay, names: [] };
    if (!P || shownDay === null) return out;
    var D = P.days[shownType]; if (!D) return out;
    var inputs = root.querySelectorAll('input.wt');
    for (var i=0;i<inputs.length;i++){
      var xi = +inputs[i].dataset.x; if (!D.ex[xi]) continue;
      if (!inputs[i].dataset.touched) continue;              // untouched box is not an edit
      var name = D.ex[xi][0], v = inputs[i].value.trim(), r = rec(shownDay, name);
      if (r.w !== v){ r.w = v; out.names.push(name); }
    }
    return out;
  }

  function render(){
    var carried = harvest();
    if (carried.names.length) cacheLog();
    var i = idx(view);
    if (i < 0) { shownDay = null; root.innerHTML = '<p style="padding:36px 0;text-align:center;color:var(--muted)">No session.</p>'; return; }
    var S = P.sessions[i], D = P.days[S.t], h = '';
    navlab.textContent = S.t + ' · ' + S.lab;

    var today = todayISO(), lastS = P.sessions[P.sessions.length-1], notice = '';
    lastDay = today;
    if (today > lastS.d){
      notice += '<p class="notice">Program finished. The last session was ' + esc(lastS.lng) + '.</p>';
    } else if (idx(today) < 0 && S.d === nearest(today)){
      notice += '<p class="notice">Today is a rest day. Nothing to lift. Your next session is below.</p>';
    }
    var soon = null;
    for (var z=0;z<P.sessions.length;z++){ if (P.sessions[z].dl && P.sessions[z].d > S.d){ soon = P.sessions[z]; break; } }
    if (!S.dl && soon && (Date.parse(soon.d) - Date.parse(S.d)) / 86400000 <= 9){
      notice += '<p class="notice soft">Deload week starts ' + esc(soon.lab) + '.</p>';
    }
    h += notice;
    h += '<header class="s-head"><p class="s-eyebrow">Week ' + S.w + (S.dl ? ' · deload' : '') +
         ' · ' + esc(D.loc) + '</p><h2>' + S.t + '</h2><p class="s-date">' + esc(S.lng) + '</p>' +
         (S.dl ? '<p class="deload">Deload week. The sets below are already cut for you. Keep the same weight you have been using, and stop 2 to 4 reps earlier than you normally would.</p>' : '') + '</header>';
    for (var j=0;j<D.ex.length;j++){
      var e = D.ex[j], name=e[0], sets=setCount(S, e), reps=e[2], rest=e[3], vid=e[4], cue=e[5];
      var r = rec(S.d, name);
      var allOn = r.s.length === sets && r.s.every(function(x){ return x; });
      var mm = Math.floor(rest/60), ss = rest%60, rl = mm + ':' + (ss<10?'0':'') + ss;
      var prev = r.w ? null : prevWeight(S.d, name);
      var hint = prev ? ' placeholder="' + esc(prev.w) + ' last time" data-prev="' + esc(prev.w) + '"' : '';
      var warm = '';
      if (j === 0){
        var wn = parseFloat(r.w), hasW = !isNaN(wn) && wn > 0;
        warm = '<div class="warm"><span class="warmlab">' +
          (hasW ? 'Warm-up first, off ' + esc(r.w) + ' lbs'
                : 'Warm-up first. Enter your working weight above to see the loads.') + '</span>';
        for (var q=0;q<WARM.length;q++){
          var wq = WARM[q];
          var lab = hasW ? wq[0] + ' \u00d7 ' + round5(wn*wq[1]) + ' lbs'
                         : wq[0] + ' \u00d7 ' + Math.round(wq[1]*100) + '%';
          warm += '<button class="warmb' + (warmDone[S.d+'|'+name+'|'+q] ? ' on' : '') +
            '" type="button" data-wx="'+q+'">' + lab +
            (wq[2] ? '<em>' + wq[2] + '</em>' : '<em></em>') + '</button>';
        }
        warm += '<span class="warmnote">Tap each one you finish. Rest 1:00 starts.</span></div>';
      }
      var btns = '';
      for (var k=0;k<sets;k++)
        btns += '<button class="setb' + (r.s[k]?' on':'') + '" data-x="'+j+'" data-k="'+k+'" type="button">' + (k+1) + '</button>';
      h += '<article class="ex' + (allOn?' done':'') + '">' +
        '<div class="ex-top"><h3>' + esc(name) + '</h3><span class="chip">' + sets + ' × ' + reps + '</span></div>' +
        '<p class="cue">' + esc(cue) + '</p>' +
        '<div class="entry"><label class="wt-wrap"><span>lbs</span>' +
        '<input class="wt' + (r.w?' set':'') + '" type="text" inputmode="decimal" enterkeyhint="done" ' +
        'autocomplete="off" aria-label="' + esc(name) + ' weight" data-x="'+j+'"' + hint + ' value="' + esc(r.w) + '"></label>' +
        '<button class="enter' + (r.w?' set':'') + '" type="button" data-x="'+j+'">' + (r.w?'Logged':'Enter') + '</button></div>' +
        warm +
        '<span class="setlab">Tap the set you finished. Rest ' + rl + ' starts.</span>' +
        '<div class="setbtns">' + btns + '</div>' +
        '<a class="video" href="https://www.youtube.com/watch?v=' + vid + '" target="_blank" rel="noopener">&#9654; Watch form</a>' +
        '</article>';
    }
    root.innerHTML = h;
    shownDay = S.d; shownType = S.t;
    for (var c=0;c<carried.names.length;c++) push(carried.day, carried.names[c]);
  }

  function sendOne(item){
    return fetch(API, {
      method: 'POST',
      headers: hdrs({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({
        session_date: item.session_date, exercise: item.exercise,
        weight: item.weight, sets: item.sets
      })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){ throw new Error('HTTP ' + res.status + ' ' + t.slice(0,60)); });
    });
  }

  function flushPending(){
    var q = readPending(); if (q.length === 0) return Promise.resolve();
    setStatus('Syncing offline changes...','');
    var p = Promise.resolve();
    q.forEach(function(item) {
      p = p.then(function() {
        return sendOne(item).then(function(){
          var nq = readPending();
          writePending(nq.filter(function(x) {
            return x.session_date !== item.session_date || x.exercise !== item.exercise || x.timestamp !== item.timestamp;
          }));
        });
      });
    });
    return p.then(function(){ setStatus('Offline changes synced','ok'); })
            .catch(function(){ setStatus('Could not sync offline changes','warn'); });
  }

  function mergeLog(remoteLog) {
    var q = readPending();
    LOG = remoteLog || {};
    // Apply pending offline edits on top of the remote state
    q.forEach(function(item) {
      if(!LOG[item.session_date]) LOG[item.session_date]={};
      LOG[item.session_date][item.exercise] = {w: item.weight, s: item.sets};
    });
    cacheLog();
  }

  function pull(){
    setStatus('Loading...','');
    flushPending().then(function(){
      return fetch(API + '?select=session_date,exercise,weight,sets', { headers: hdrs() })
        .then(function(r){
          if (!r.ok) return r.text().then(function(t){ throw new Error('HTTP ' + r.status + ' ' + t.slice(0,60)); });
          return r.json();
        })
        .then(function(rows){
          var remote = {};
          (rows || []).forEach(function(row){
            if (!remote[row.session_date]) remote[row.session_date] = {};
            remote[row.session_date][row.exercise] = {
              w: row.weight == null ? '' : String(row.weight),
              s: row.sets || []
            };
          });
          mergeLog(remote);
          render(); setStatus('Synced','ok');
        });
    }).catch(function(err){
      LOG = readCache();
      render();
      setStatus('Offline, using this device: ' + String(err.message||err).slice(0,40), 'warn');
    });
  }

  function push(date, name){
    var r = rec(date, name);
    var key = date + '|' + name, sig = r.w + '|' + r.s.join(',');
    if (sent[key] === sig) return;   // same payload as the last send for this row, nothing changed
    sent[key] = sig;
    var item = { session_date: date, exercise: name, weight: r.w, sets: r.s, timestamp: Date.now() };
    var q = readPending();
    var idx2 = -1;
    for (var i=0; i<q.length; i++) {
      if (q[i].session_date === date && q[i].exercise === name) { idx2 = i; break; }
    }
    if (idx2 >= 0) q[idx2] = item; else q.push(item);
    writePending(q);

    setStatus('Saving...','');
    sendOne(item).then(function(){
      var nq = readPending();
      writePending(nq.filter(function(x) {
        return x.session_date !== date || x.exercise !== name || x.timestamp !== item.timestamp;
      }));
      var t = new Date();
      setStatus('Saved ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2,'0'), 'ok');
    }).catch(function(){
      setStatus('Saved locally. Will sync later.', 'warn');
    });
  }

  root.addEventListener('click', function(ev){
    if (!P) return;
    var S = P.sessions[idx(view)]; if (!S) return; var D = P.days[S.t];
    var wb = ev.target.closest('.warmb');
    if (wb){
      var wq2 = +wb.dataset.wx, wnm = D.ex[0][0], wkey = S.d+'|'+wnm+'|'+wq2;
      warmDone[wkey] = !warmDone[wkey];
      if (warmDone[wkey]) startTimer(WARM_REST, wnm + '  warm-up ' + (wq2+1));
      render(); return;
    }
    var en = ev.target.closest('.enter');
    if (en){
      var xi = +en.dataset.x, inp = root.querySelector('input.wt[data-x="'+xi+'"]');
      rec(S.d, D.ex[xi][0]).w = inp.value.trim();
      cacheLog(); render(); push(S.d, D.ex[xi][0]); return;
    }
    var sb = ev.target.closest('.setb');
    if (sb){
      var x = +sb.dataset.x, k = +sb.dataset.k, e = D.ex[x], r = rec(S.d, e[0]);
      while (r.s.length < setCount(S, e)) r.s.push(0);
      r.s[k] = r.s[k] ? 0 : 1;
      if (r.s[k]) startTimer(e[3], e[0] + '  set ' + (k+1));
      cacheLog(); render(); push(S.d, e[0]);
    }
  });
  root.addEventListener('input', function(ev){
    if (ev.target && ev.target.classList && ev.target.classList.contains('wt')) ev.target.dataset.touched = '1';
  });
  root.addEventListener('focusin', function(ev){
    var t = ev.target;
    if (t && t.classList && t.classList.contains('wt') && !t.value && t.dataset.prev){
      t.value = t.dataset.prev;
      t.dataset.touched = '1';
      try { t.select(); } catch(e){}
    }
  });
  root.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && ev.target.classList.contains('wt')){
      ev.preventDefault();
      var S = P.sessions[idx(view)], D = P.days[S.t], xi = +ev.target.dataset.x;
      rec(S.d, D.ex[xi][0]).w = ev.target.value.trim();
      cacheLog(); render(); push(S.d, D.ex[xi][0]);
    }
  });

  function go(iso){ view = iso; render(); window.scrollTo(0,0); }
  document.getElementById('prev').addEventListener('click', function(){ var i=idx(view); if(i>0) go(P.sessions[i-1].d); });
  document.getElementById('next').addEventListener('click', function(){ var i=idx(view); if(i<P.sessions.length-1) go(P.sessions[i+1].d); });
  document.getElementById('jump').addEventListener('click', function(){ go(nearest(todayISO())); });

  var clock = document.getElementById('clock'), who = document.getElementById('who');
  var endAt = null, fired = false, lock = null, ac = null, tlabel = '';
  function fmt(s){ var n = s<0; s = Math.abs(s);
    return (n?'-':'') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
  function tick(){ if (endAt === null) return;
    var left = Math.round((endAt - Date.now())/1000);
    clock.textContent = fmt(left); clock.className = left>0 ? 'run' : 'fin';
    if (left<=0 && !fired){ fired = true; ding(); }
    if (left<=-180) stopTimer(); }
  function wake(){ try { if (navigator.wakeLock && !lock)
    navigator.wakeLock.request('screen').then(function(l){ lock=l;
      l.addEventListener('release', function(){ lock=null; }); }).catch(function(){}); } catch(e){} }
  function unlock(){ try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    var b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
    src.buffer = b; src.connect(ac.destination); src.start(0);   // silent, just unlocks
  } catch(e){} }
  function beep(){ try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination);
    o.frequency.value = 680; g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.6);
    o.start(); o.stop(ac.currentTime+0.6); } catch(e){} }
  function ding(){ beep(); if (navigator.vibrate) navigator.vibrate([200,100,200,100,300]);
    try { if (window.Notification && Notification.permission === 'granted')
      new Notification('Rest over', { body: tlabel || 'Back to work.' }); } catch(e){} }
  function startTimer(sec, name){
    try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
    endAt = Date.now() + sec*1000; fired = false; tlabel = name || '';
    who.textContent = tlabel; wake(); unlock(); tick(); }
  function stopTimer(){ endAt = null; fired = false; tlabel = '';
    clock.textContent = '0:00'; clock.className = ''; who.textContent = '';
    try { if (lock){ lock.release(); lock = null; } } catch(e){} }
  setInterval(tick, 250);
  function dayCheck(){
    if (!P || lastDay === null) return;
    var t = todayISO();
    if (t === lastDay) return;
    if (view === nearest(lastDay)) view = nearest(t);   // only re-anchor if you were on 'today'
    render();
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ dayCheck(); tick(); if (endAt!==null) wake(); } });
  window.addEventListener('focus', dayCheck);
  window.addEventListener('pageshow', dayCheck);
  window.addEventListener('focus', tick); window.addEventListener('pageshow', tick);
  window.addEventListener('online', function(){
    setStatus('Back online, syncing...','');
    pull();
  });
  document.getElementById('stopb').addEventListener('click', stopTimer);

  fetch('program.json').then(function(r){ return r.json(); }).then(function(p){
    P = p; view = nearest(todayISO()); LOG = readCache();
    mergeLog(LOG); // Ensure pending offline changes are applied on top of the cached log
    render();
    pull();
  }).catch(function(err){
    root.innerHTML = '<p style="padding:36px 0;text-align:center;color:var(--bad)">Could not load program.json</p>';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').then(function(registration) {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
      }).catch(function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
    });
  }
})();
</script>
</body>
</html>
